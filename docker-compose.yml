# Example deployment. Start with `docker compose up -d`, then read the setup code from
# `docker compose logs open-parcels` and enter it in the web UI at http://localhost:3000.
services:
  open-parcels:
    # Docker Hub is the main registry. Mirror when Docker Hub has problems:
    # ghcr.io/open-parcels/open-parcels:latest
    image: bluscream1/open-parcels:latest
    container_name: open-parcels
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - open-parcels-data:/data
      # - open-parcels-tailscale:/var/lib/tailscale
    environment:
      OPENPARCELS_LOG_LEVEL: info
      # OPENPARCELS_PUBLIC_URL: https://parcels.example.com
      # OPENPARCELS_SECURE_COOKIES: "true"
      # A web UI or other web page on another address (exact origins, comma-separated):
      # OPENPARCELS_CORS_ORIGINS: https://parcels-ui.example.com
      # Without a reader password anyone who can reach the server can read (not change) everything.
      # OPENPARCELS_PASSWORD: change-me-reader
      # Without an admin password, the first start asks for the setup code from the log.
      # OPENPARCELS_ADMIN_PASSWORD: change-me-admin-password
      # Built-in Tailscale (no sidecar): serves the web UI on https://<TS_HOSTNAME>.<tailnet>.ts.net.
      # Needs the open-parcels-tailscale volume below. TS_AUTHKEY only for the first start.
      # TS_STATE_DIR: /var/lib/tailscale
      # TS_HOSTNAME: open-parcels
      # TS_AUTHKEY: tskey-auth-...
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  open-parcels-data:
  # open-parcels-tailscale:
